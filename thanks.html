<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Message Sent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcfbfa;
            color: #2c2520;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 450px;
            border-top: 4px solid #5c4033; /* Matching timber earth tone */
        }
        h1 {
            color: #5c4033;
            margin-bottom: 10px;
        }
        p {
            color: #6e655f;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #5c4033;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #4a3329;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔨 Message Received!</h1>
        <p>Thanks for reaching out. I've received your inquiry and will get back to you as soon as I brush the sawdust off my hands—usually within 24 to 48 hours.</p>
        <a href="index.html" class="btn">Return to Shop</a>
    </div>

</body>
</html>
